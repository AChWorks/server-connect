name: Candidate QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: server-connect-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-real-core:
    runs-on: ubuntu-24.04
    # Product APT execution policy is intentionally verified against the
    # advertised Debian 13 environment. Ubuntu's APT layout is not equivalent.
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    env:
      GOPROXY: 'off'
      GOTOOLCHAIN: 'local'
    steps:
      - name: Prepare native Debian 13 APT and pinned-core test dependencies
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = debian
          test "$VERSION_ID" = 13
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git python3 tar gzip sudo
          apt-config --version
          git --version
      - name: Checkout source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Download and verify genuine upstream core (test/build only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci
          curl --fail --location --show-error --silent --retry 2 --connect-timeout 15 --max-time 150 \
            --output build/ci/sing-box.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz
          echo 'e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee  build/ci/sing-box.tar.gz' | sha256sum --check
          tar -xzf build/ci/sing-box.tar.gz -C build/ci
          build/ci/sing-box-1.14.3-linux-amd64/sing-box version
      - name: Unit tests, pinned-core local VLESS integration, static Go checks
        shell: bash
        env:
          SC_TEST_SINGBOX: ${{ github.workspace }}/build/ci/sing-box-1.14.3-linux-amd64/sing-box
        run: |
          set -euo pipefail
          go vet ./...
          go test ./... -count=1 -timeout=100s -v
          sh -n bundle/install.sh scripts/package.sh scripts/bootstrap-online.sh
          # Disposable Debian container ONLY: exercise real unprivileged ->
          # sudo env_reset -> clean /usr/bin/env -i -> root shell boundary.
          # The temporary sudoers entry is removed even on test failure.
          printf 'nobody ALL=(root) NOPASSWD: /usr/bin/env\n' > /etc/sudoers.d/server-connect-qa
          chmod 0440 /etc/sudoers.d/server-connect-qa
          trap 'rm -f /etc/sudoers.d/server-connect-qa' EXIT
          SC_QA_SUDO_ENTRY=1 python3 scripts/test_bootstrap_online.py
          rm -f /etc/sudoers.d/server-connect-qa
          trap - EXIT
      - name: Native Debian 13 read-only host preflight
        shell: bash
        run: |
          set -euo pipefail
          # Keep original tests in the minimal APT layout; install optional
          # host inspection tools only for their own real-kernel test.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends iproute2
          test -x /usr/bin/ip
          go test ./internal/sc -run '^TestPreflight' -count=1 -v
          # GitHub's checkout is runner-owned inside this container. Trust
          # only this ephemeral checkout for Go VCS stamping (do not disable it).
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
          go build -o build/ci/server-connect-cli ./cmd/server-connect
          # Real native-iproute2 selective preview: proposal only, never apply.
          build/ci/server-connect-cli --json selective-plan \
            --endpoint 198.51.100.10 --management-peer 203.0.113.42 \
            --tunnel-if scpreview0 --destination 8.8.8.0/24 \
            > build/ci/selective-plan.json
          python3 - <<'PYPLAN'
          import json
          with open('build/ci/selective-plan.json') as f:
              response=json.load(f)
          assert response['ok'] is True
          plan=response['data']
          assert plan['read_only'] is True
          for negative in ('activation_ready','snapshot_atomic','guard_armed','ownership_verified'):
              assert plan[negative] is False
          assert plan['route_table'] >= 20000
          assert len(plan['routes']) == len(plan['rules']) == 1
          assert plan['routes'][0]['destination'] == '8.8.8.0/24'
          assert len(plan['plan_sha256']) == 64
          PYPLAN
          # A second native-iproute2 preview spans both families even on a
          # host with no IPv6 default route. It must remain advisory only.
          build/ci/server-connect-cli --json selective-plan \
            --endpoint 198.51.100.10 --management-peer 203.0.113.42 \
            --tunnel-if scpreview0 --destination 8.8.8.0/24 \
            --destination 2606:4700:4700::/48 \
            > build/ci/selective-plan-mixed.json
          python3 - <<'PYMIXED'
          import json
          with open('build/ci/selective-plan-mixed.json') as f:
              response=json.load(f)
          assert response['ok'] is True
          plan=response['data']
          assert plan['read_only'] is True
          for negative in ('activation_ready','snapshot_atomic','guard_armed','ownership_verified'):
              assert plan[negative] is False
          assert len(plan['routes']) == len(plan['rules']) == 2
          assert {r['family'] for r in plan['routes']} == {'ipv4','ipv6'}
          assert {r['family'] for r in plan['rules']} == {'ipv4','ipv6'}
          assert len(plan['observation_sha256']) == len(plan['plan_sha256']) == 64
          PYMIXED
          build/ci/server-connect-cli --json host-preflight --endpoint 127.0.0.1 \
            --management-peer 127.0.0.2 > build/ci/host-preflight.json
          python3 - <<'PYQA'
          import json
          with open('build/ci/host-preflight.json') as source:
              response = json.load(source)
          report = response['data']
          assert response['ok'] is True
          assert report['read_only'] is True
          assert report['activation_ready'] is False
          assert report['snapshot_atomic'] is False
          assert report['endpoint']['target'] == '127.0.0.1'
          assert report['management_peer']['target'] == '127.0.0.2'
          PYQA
      - name: Local QA artifact and digest-verified online acquisition smoke
        shell: bash
        run: |
          set -euo pipefail
          # Docker job containers may run under an identity different from
          # the runner-owned checkout. Trust ONLY this ephemeral checkout
          # within this step, preserving Go VCS stamping and source identity.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
          git status --porcelain
          scripts/package.sh "$PWD/build/ci/sing-box.tar.gz"
          mkdir -p build/ci/http
          cp dist/server-connect-0.1.0-dev-debian13-amd64-local-qa.tar.gz build/ci/http/bundle.tar.gz
          DIGEST=$(sha256sum build/ci/http/bundle.tar.gz | cut -d' ' -f1)
          python3 -m http.server 19179 --bind 127.0.0.1 --directory build/ci/http >/dev/null 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true' EXIT
          sleep 1
          scripts/bootstrap-online.sh --archive-url http://127.0.0.1:19179/bundle.tar.gz --sha256 "$DIGEST" --verify-only
          if scripts/bootstrap-online.sh --archive-url http://127.0.0.1:19179/bundle.tar.gz --sha256 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --verify-only;then
            echo 'Digest mismatch unexpectedly accepted' >&2
            exit 1
          fi
          # Even a digest-matching download must not unpack traversal entries.
          python3 - <<'PYQA'
          import io,tarfile
          with tarfile.open('build/ci/http/traversal.tar.gz','w:gz') as tar:
              body=b'not a trusted release'
              entry=tarfile.TarInfo('server-connect/../../escape')
              entry.size=len(body)
              tar.addfile(entry,io.BytesIO(body))
          PYQA
          BAD_DIGEST=$(sha256sum build/ci/http/traversal.tar.gz | cut -d' ' -f1)
          if scripts/bootstrap-online.sh --archive-url http://127.0.0.1:19179/traversal.tar.gz --sha256 "$BAD_DIGEST" --verify-only;then
            echo 'Unsafe archive traversal unexpectedly accepted' >&2
            exit 1
          fi
          echo 'QA-only build/acquisition passed; no public binary published.'
