schemaVersion: achworks.dev/v1alpha1
kind: Component

metadata:
  name: server-connect
  title: Server Connect
  description: Offline-first, fail-safe Linux server connectivity manager.

spec:
  type: linux-server-utility
  lifecycle: development
  system: server-connect
  ownership: AChWorks

  technology:
    languages:
      - Go
    frameworks: []
    runtimes:
      - Linux
      - sing-box

  capabilities:
    provides:
      - offline-connectivity-bundles
      - local-http-socks-proxy
      - offline-iran-ip-geolocation
    consumes:
      - sing-box

  interfaces:
    - type: cli
      name: server-connect
      contract: cmd/server-connect/main.go

  dependencies: []

  documentation:
    path: docs/

  source:
    repository: AChWorks/server-connect
    url: https://github.com/AChWorks/server-connect

  extensions: {}
